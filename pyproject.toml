[project]
name = "whisper-vits-svc"
version = "5.1.1"
description = "Variational Inference with adversarial learning for end-to-end Singing Voice Conversion based on VITS"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "tensorboard>=2.20.0",
    "fsspec>=2025.7.0",
    "pyworld>=0.3.5",
    "matplotlib==3.9.0",
    "soundfile>=0.13.1",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "transformers>=4.55.2",
    "tqdm>=4.67.1",
    "librosa>=0.11.0",
    "omegaconf>=2.3.0",
    "gradio>=5.42.0",
    "ruamel-yaml>=0.18.14",
    "resampy>=0.4.3",
    "numpy==1.24",
    "chardet>=5.2.0",
    "faiss-cpu==1.7.4",
]

[project.urls]
Homepage = "https://github.com/GoldenBookCover/whisper-vits-svc"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", marker = " sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
